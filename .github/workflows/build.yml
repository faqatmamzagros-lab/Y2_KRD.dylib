name: Compile dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
    - name: Compile to dylib
      run: |
        export THEOS=~/theos
        make
